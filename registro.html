<!DOCTYPE html>
<html lang="en">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftCash</title>

    <!-- Bootstrap CSS (primero) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tus estilos DESPUÉS de Bootstrap -->
    <link href="css/pages/registro.css" rel="stylesheet">
</head>

</head>
<body id="fondo">
    <section class="form-section" id="principal">
        <div class="container text-center" id="tarjeta" >
            <h2>Registrate</h2>
            <form class="needs-validation" novalidate>
                <div class="mb-3">
                     <label for="username" class="form-label">Nombre de usuario</label>
                     <input type="text" class="form-control" id="username" placeholder="Ingresa tu nombre de usuario" required>
                 </div>
                <div class="mb-3">
                     <label for="email" class="form-label">Correo Electrónico</label>
                     <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico" required>
                 </div>
              <div class="mb-3">
                      <label for="password" class="form-label">Contraseña</label>
                      <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
                <div class="mb-3">
                      <label for="confirm-password" class="form-label">Confirmar Contraseña</label>
                      <input type="password" class="form-control" id="confirm-password" placeholder="Confirma tu contraseña" required>
                </div>
                <button type="submit" class="btn" id="btn-registrate">Registrate</button>
            </form>
            <div class="container text-center mt-3">
                <p>¿Ya tienes una cuenta? <a href="inicio-sesion.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </section>


</body>
</html>
